[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-medico-v2"
version = "0.1.0"
description = "Assistente virtual medico com LLM fine-tuned (Phi-3-mini QLoRA), LangChain e LangGraph"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
